name: Build Debug ELF Loader

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [debug, strace]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libncurses-dev \
            libyaml-dev \
            flex \
            bison \
            qemu-system-x86 \
            qemu-kvm \
            seabios

      - name: Fetch Unikraft and libraries
        run: |
          ./scripts/setup.sh

      - name: Configure build
        run: |
          make distclean
          make defconfig UK_DEFCONFIG="${GITHUB_WORKSPACE}/defconfigs/fc-x86_64-initrd-${{ matrix.variant }}"

      - name: Build
        run: |
          make -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p dist/${{ matrix.variant }}
          cp workdir/build/elfloader_fc-x86_64 dist/${{ matrix.variant }}/elfloader_fc-x86_64-${{ matrix.variant }}
          cp workdir/build/elfloader_fc-x86_64.dbg dist/${{ matrix.variant }}/elfloader_fc-x86_64-${{ matrix.variant }}.dbg
          cp workdir/build/elfloader_fc-x86_64.bootinfo dist/${{ matrix.variant }}/elfloader_fc-x86_64-${{ matrix.variant }}.bootinfo
          cp .config dist/${{ matrix.variant }}/config

      - name: Install KraftKit
        run: |
          wget -qO- https://github.com/unikraft/kraftkit/releases/download/v0.9.3/kraft_0.9.3_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/kraft /usr/local/bin/kraft

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push OCI Image
        run: |
          # Use KraftKit to package the custom kernel into an OCI image and push it to GHCR
          kraft pkg -m x86_64 -p kraftcloud \
            --kernel dist/${{ matrix.variant }}/elfloader_fc-x86_64-${{ matrix.variant }} \
            --name ghcr.io/${{ github.repository_owner }}/base-compat-${{ matrix.variant }}:latest \
            --push \
            .

      - name: Upload Debug ELF Loader artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elfloader-fc-x86_64-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/${{ matrix.variant }}/*
